<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Container Gate Intake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="index.html">Smart Port Gate System</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="master-data.html">Master Data</a>
        <a class="nav-link active" href="gate-in.html">Gate-In Intake</a>
        <a class="nav-link" href="finance-reports.html">Finance & Reports</a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="mb-4 text-primary">Optical OCR & Weighbridge Gate Ingestion</h3>
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold">Ingest Gate Telemetry</h5>
                <form onsubmit="processScan(event)">
                    <div class="mb-2">
                        <label class="form-label">Container OCR Code</label>
                        <input type="text" id="ocrCode" class="form-control" placeholder="MSCU-782194" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Gate ID</label>
                        <input type="number" id="gateId" class="form-control" value="1" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Carrier Contact ID</label>
                        <input type="number" id="carrierId" class="form-control" value="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gross Weighbridge Weight (Tonnes)</label>
                        <input type="number" step="0.1" id="grossWeight" class="form-control" placeholder="33.8" required>
                    </div>
                    <button class="btn btn-primary w-100">Process & Save Entry</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold">Live Clearance Status</h5>
                <div id="resultBox" class="text-muted">Fill the form and submit to see clearance calculations.</div>
            </div>
        </div>
    </div>
</div>

<script>
    async function processScan(e) {
        e.preventDefault();
        const body = {
            containerOcrCode: document.getElementById('ocrCode').value,
            gateId: parseInt(document.getElementById('gateId').value),
            carrierId: parseInt(document.getElementById('carrierId').value),
            grossWeightTonnes: parseFloat(document.getElementById('grossWeight').value)
        };
        const res = await fetch('/api/port/gate-in', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const d = await res.json();
        const badge = d.overweight ? '<span class="badge bg-danger">OVERWEIGHT FLAGGED</span>' : '<span class="badge bg-success">COMPLIANT</span>';

        document.getElementById('resultBox').innerHTML = `
                <div class="alert alert-info">
                    <h5>Entry Saved (ID: ${d.entryId}) ${badge}</h5>
                    <p><b>Container:</b> ${d.containerOcrCode}</p>
                    <p><b>Gross Weight:</b> ${d.grossWeightTonnes} Tonnes (Max: ${d.maxAllowedWeightTonnes} Tonnes)</p>
                    <hr>
                    <p><b>Standard Clearance Fee:</b> $${d.standardFee}</p>
                    <p><b>Overweight Surcharge:</b> $${d.surchargeFee}</p>
                    <h5 class="text-danger fw-bold">Total Payable: $${d.totalAmount}</h5>
                </div>
            `;
    }
</script>
</body>
</html>
